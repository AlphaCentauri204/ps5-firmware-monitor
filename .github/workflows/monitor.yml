name: PS5 Firmware Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PS5 and 13.60 status
        id: check
        shell: bash
        run: |
          set -euo pipefail

          TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"

          # Current official/community firmware list.
          FW_DATA="$(curl -fsSL --max-time 20             https://raw.githubusercontent.com/MewX/ps5-official-firmware-list/main/README.md)"

          if echo "$FW_DATA" | grep -qE '\| 14\.00\.00 \|'; then
            LATEST="14.00"
          else
            LATEST="$(echo "$FW_DATA" | grep -oE '\| [0-9]+\.[0-9]+\.00 \|' | head -1 | tr -d '| ' || true)"
            LATEST="${LATEST:-unknown}"
          fi

          # Sony's public PSN status page. This checks PSN generally,
          # not whether Sony has specifically blocked firmware 13.60.
          PSN_PAGE="$(curl -fsSL --max-time 20 'https://status.playstation.com/?smcid=pdc:en-us:ps5:primary+nav:msg-support:psn-status' || true)"

          if echo "$PSN_PAGE" | grep -qi "All services are up and running"; then
            PSN_GENERAL="ONLINE"
          else
            PSN_GENERAL="ISSUE"
          fi

          # Look for the newest 13.60/PSN reports in the PS5 jailbreak
          # community. This is a signal only; it is NOT an official Sony test.
          REDDIT="$(curl -fsSL --max-time 20             -A 'PS5-Firmware-Monitor/1.0'             'https://www.reddit.com/r/PS5_Jailbreak/search.json?q=13.60%20PSN&restrict_sr=1&sort=new&t=day&limit=10' || true)"

          COMMUNITY="UNKNOWN"
          if echo "$REDDIT" | grep -Eqi 'still (works|working|online)|still.*PSN|PSN.*still|can still connect|still connect'; then
            COMMUNITY="ONLINE_REPORTS"
          fi
          if echo "$REDDIT" | grep -Eqi 'PSN.*(offline|down|shutdown|stopped)|13\.60.*(offline|down|shutdown|stopped)|no longer.*PSN|PSN.*no longer|lost PSN'; then
            COMMUNITY="OFFLINE_REPORTS"
          fi

          STATUS="LATEST=${LATEST}|PSN_GENERAL=${PSN_GENERAL}|13_60_COMMUNITY=${COMMUNITY}"

          printf '%s\n' "$STATUS" > current_status.txt

          {
            echo "time=$TIME"
            echo "latest=$LATEST"
            echo "psn_general=$PSN_GENERAL"
            echo "community_13_60=$COMMUNITY"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with previous status
        id: compare
        shell: bash
        run: |
          NEW_STATUS="$(cat current_status.txt)"
          OLD_STATUS=""
          if [ -f state/latest.txt ]; then
            OLD_STATUS="$(cat state/latest.txt)"
          fi

          if [ "$NEW_STATUS" != "$OLD_STATUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          EVENT="Automatic status change"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EVENT="Manual check"
          fi

          MESSAGE="🎮 PS5 Firmware Monitor

          Latest firmware: ${{ steps.check.outputs.latest }}

          PSN general status: ${{ steps.check.outputs.psn_general }}

          13.60 PSN-specific signal:
          ${{ steps.check.outputs.community_13_60 }}

          ⚠️ The 13.60 line is based on community reports, because Sony does not provide a public endpoint that directly reports PSN eligibility for a specific old firmware.

          Check type: $EVENT
          Checked: ${{ steps.check.outputs.time }}

          Automatic checks: every 5 minutes"

          curl -sS -X POST             "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"             -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}"             --data-urlencode text="$MESSAGE"

      - name: Save status
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p state
          cp current_status.txt state/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update PS5 monitor state"
          git push
